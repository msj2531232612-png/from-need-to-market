name: checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Unit tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Validate the published example
        run: python -X utf8 skills/from-need-to-market/scripts/validate_research_output.py examples/whatsapp-quotation
